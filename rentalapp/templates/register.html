<!DOCTYPE html>
<html>

<head>
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* ===== BACKGROUND ===== */
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            font-family: 'Poppins', sans-serif;
            color: white;
        }

        /* ===== CARD ===== */
        .register-card {
            width: 100%;
            max-width: 420px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(18px);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
            transition: 0.4s;
        }

        /* Hover glow */
        .register-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 60px rgba(0, 242, 254, 0.3);
        }

        /* ===== INPUTS ===== */
        .custom-input {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            border-radius: 12px;
            padding: 12px;
            color: white;
            margin-bottom: 12px;
            transition: 0.3s;
        }

        /* Input focus glow */
        .custom-input:focus {
            outline: none;
            box-shadow: 0 0 10px #00f2fe;
            background: rgba(255, 255, 255, 0.12);
        }

        /* Placeholder */
        .custom-input::placeholder {
            color: #bbb;
        }

        /* ===== BUTTON ===== */
        .btn-premium {
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            border: none;
            border-radius: 12px;
            padding: 10px;
            font-weight: bold;
            color: black;
            transition: 0.3s;
        }

        .btn-premium:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px #00f2fe;
        }

        /* ===== LINK ===== */
        .login-link {
            color: #00f2fe;
            text-decoration: none;
        }

        .login-link:hover {
            text-decoration: underline;
        }

        /* ===== RESPONSIVE ===== */
        @media(max-width: 500px) {
            .register-card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="container d-flex align-items-center justify-content-center min-vh-100">

        <div class="register-card p-4">

            <h3 class="text-center mb-4">🚀 Create Account</h3>

            {% for message in messages %}
            <p class="text-danger text-center">{{ message }}</p>
            {% endfor %}

            <form method="POST">
                {% csrf_token %}

                <div class="row">
                    <div class="col-12">
                        <input class="form-control custom-input" type="text" name="username" placeholder="Username"
                            required>
                    </div>

                    <div class="col-12">
                        <input class="form-control custom-input" type="email" name="email" placeholder="Email" required>
                    </div>

                    <div class="col-md-6">
                        <input class="form-control custom-input" type="text" name="first_name" placeholder="First Name"
                            required>
                    </div>

                    <div class="col-md-6">
                        <input class="form-control custom-input" type="text" name="last_name" placeholder="Last Name">
                    </div>

                    <div class="col-12">
                        <input class="form-control custom-input" type="password" name="password" placeholder="Password"
                            required>
                    </div>
                </div>

                <button class="btn btn-premium w-100 mt-3">Register</button>
            </form>

            <p class="text-center mt-3">
                Already have an account?
                <a href="{% url 'login' %}" class="login-link">Login</a>
            </p>

        </div>
    </div>
</body>

</html>

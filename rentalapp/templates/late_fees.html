{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Late Fee</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

/* 🌌 BACKGROUND */
body{
    margin:0;
    font-family:'Poppins',sans-serif;
    background: radial-gradient(circle at top,#0f2027,#203a43,#2c5364);
    color:white;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* 💎 GLASS CARD */
.card-box{
    width:100%;
    max-width:420px;
    padding:40px;
    border-radius:25px;
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(20px);
    box-shadow:0 25px 60px rgba(0,0,0,0.7);
    animation: fadeUp 0.7s ease;
}

/* ✨ ANIMATION */
@keyframes fadeUp{
    from{opacity:0; transform:translateY(40px);}
    to{opacity:1; transform:translateY(0);}
}

/* 🔥 TITLE */
.title{
    text-align:center;
    font-size:28px;
    font-weight:700;
    margin-bottom:25px;
    background: linear-gradient(90deg,#00ffd5,#00a8ff,#6a5cff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

/* 📦 INPUT */
input{
    width:100%;
    padding:14px;
    border:none;
    border-radius:15px;
    background: rgba(255,255,255,0.08);
    color:white;
    font-size:16px;
    transition:0.3s;
}

input::placeholder{
    color:#bbb;
}

input:focus{
    outline:none;
    box-shadow:0 0 12px #00c6ff;
}

/* 🏷 LABEL */
label{
    margin-bottom:8px;
    font-weight:500;
    color:#ddd;
}

/* 🚀 BUTTON */
button{
    width:100%;
    margin-top:20px;
    padding:14px;
    border:none;
    border-radius:30px;
    background: linear-gradient(135deg,#ffcc00,#ff8800);
    color:black;
    font-weight:700;
    font-size:16px;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
    box-shadow:0 10px 30px rgba(0,0,0,0.6),
               0 0 20px #ffcc00;
}

/* 📱 MOBILE */
@media(max-width:500px){
    .card-box{
        padding:25px;
    }
}

</style>

</head>

<body>

<div class="card-box">

    <h2 class="title">⚡ Add Late Fee</h2>

    <form method="POST">
        {% csrf_token %}

        <label>Late Fee (₹)</label>
        <input type="number" name="late_fees" placeholder="Enter amount..." required>

        <button type="submit">Save Fee 🚀</button>
    </form>

</div>

</body>
</html>
